<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
</head>

<body>
    <header class="header">
        <h1>Регистрация на мероприятие</h1>
        <nav>
            <ul>
                <li>
                    <a href="">Главная</a>
                </li>
                <li>
                    <a href="">Контакты</a>
                </li>
            </ul>
        </nav>
    </header>
    <main class="main">
        <form action="">
            <label for="name">Введите ваше восхождение:</label>
            <input type="text" name="name" id="name" placeholder="Ваше имя" /><br /><br>
            <label for="email">Введите ваш логин:</label>
            <input type="text" name="email" id="email" placeholder="Ваша почта" /><br><br>
            <label for="group">Введите вашу группу:</label>
            <select name="group" id="group">
                <option value="101">101</option>
                <option value="102">102</option>
                <option value="201">201</option>
                <option value="202">202</option>
            </select>
            <br />
            <br>
            <button type="submit">Зарегаться</button>
            <button type="reset">Очистить поля</button>
        </form>
    </main>
    <footer class="footer">
        <p>возникли какие либо вопросы? перейдите по <a href="#">данной</a> ссылке</p>
    </footer>
</body>
</html>
